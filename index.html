<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Márgenes Mercado Libre — Pet Shop</title>
    <meta name="description" content="Tablero mobile-first de análisis de costos, comisiones, envíos y rentabilidad de alimentos balanceados en Mercado Libre." />
    <meta property="og:title" content="Márgenes Mercado Libre — Pet Shop" />
    <meta property="og:description" content="Tablero mobile-first de análisis de costos, comisiones, envíos y rentabilidad de alimentos balanceados en Mercado Libre." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__loadCompiledBundle = function () {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './assets/app.css';
        document.head.appendChild(link);
        var s = document.createElement('script');
        s.type = 'module';
        s.src = './assets/app.js';
        document.body.appendChild(s);
      };
    </script>
    <script type="module" src="./src/main.tsx" onerror="window.__loadCompiledBundle()"></script>
    <script>
      // Si se abre en GitHub Pages desde la raíz (/repo/index.html), /src/main.tsx devuelve 404
      // o falla por MIME type. Verificamos si #root sigue vacío tras 400ms en producción estática:
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && !document.querySelector('script[src*="assets/app.js"]')) {
          window.__loadCompiledBundle();
        }
      }, 400);
    </script>
  </body>
</html>
